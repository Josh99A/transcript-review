# Render Blueprint. On render.com: New > Blueprint, pick this repo, then fill in CLOUDINARY_URL
# (Cloudinary dashboard > API Keys > API environment variable) and the ADMIN_* values.
# The database is Render Postgres; uploaded media is stored in Cloudinary.
# Render deletes a free Postgres database 30 days after it is created unless it is upgraded.
services:
  - type: web
    name: transcript-review
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: transcript-review-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Optional: copy approved jobs to Google Drive (see .env.example), then connect Drive from the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: transcript-review-db
    plan: free
    region: frankfurt
    databaseName: transcript_review
    user: transcript_review
