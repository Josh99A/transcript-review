# Render Blueprint. On render.com: New > Blueprint, pick this repo, fill in the ADMIN_* values.
# The disk keeps the database and uploaded media across deploys. Render only offers disks
# on paid instances, so the plan is "starter"; on "free" everything is wiped on every deploy.
services:
  - type: web
    name: transcript-review
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
